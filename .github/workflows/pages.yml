name: pages
# Publishes the static login page (internal/web/static) to GitHub Pages from the master branch.
# One-time repository settings:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#   Settings -> Environments -> github-pages -> Deployment branches: allow `master`
# This is the only Pages workflow: the page lives under internal/web/static, so uploading the whole
# repository (GitHub's "Static HTML" template) would publish no index.html at the site root (404).
on:
  push:
    branches: [master]
    paths:
      - "internal/web/static/**"
      - "scripts/build-pages.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: scripts/build-pages.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
