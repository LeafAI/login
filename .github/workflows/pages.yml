name: pages
# Publishes the static login page (internal/web/static) under /<tag>/ and /latest/.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          tag="${GITHUB_REF_NAME}"
          mkdir -p _site/"$tag" _site/latest
          cp internal/web/static/* _site/"$tag"/
          cp internal/web/static/* _site/latest/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
